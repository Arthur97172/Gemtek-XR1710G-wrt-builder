name: Build LuCI airoha-w1700k

on:
  workflow_dispatch:
    inputs:
      sdk_source:
        description: '选择 SDK 来源'
        required: true
        type: choice
        options:
          - ImmortalWrt
          - OpenWrt
        default: 'ImmortalWrt'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 需要写权限才能创建 Release
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h

      - name: Download SDK
        run: |
          set -e
          
          if [ "${{ github.event.inputs.sdk_source }}" = "OpenWrt" ]; then
            SDK_URL="https://downloads.openwrt.org/snapshots/targets/airoha/an7581/openwrt-sdk-airoha-an7581_gcc-14.4.0_musl.Linux-x86_64.tar.zst"
            SDK_PREFIX="openwrt-sdk-*"
            echo ">>> 使用 OpenWrt SDK"
          else
            SDK_URL="https://downloads.immortalwrt.org/snapshots/targets/airoha/an7581/immortalwrt-sdk-airoha-an7581_gcc-14.4.0_musl.Linux-x86_64.tar.zst"
            SDK_PREFIX="immortalwrt-sdk-*"
            echo ">>> 使用 ImmortalWrt SDK"
          fi
          
          echo "下载地址: $SDK_URL"
          wget -q --show-progress "$SDK_URL" -O sdk.tar.zst
          
          echo ">>> 解压 SDK..."
          tar --zstd -xf sdk.tar.zst
          
          SDK_DIR=$(find . -maxdepth 1 -type d -name "$SDK_PREFIX" | head -n1)
          if [ -z "$SDK_DIR" ]; then
            echo "错误：解压后未找到匹配的 SDK 目录 ($SDK_PREFIX)"
            ls -la
            exit 1
          fi
          
          echo "找到 SDK 目录: $SDK_DIR"
          mv "$SDK_DIR" sdk
          
          cd sdk
          echo ">>> 更新 feeds..."
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "SDK 准备完成"

      - name: Clone and copy 4 plugins from YYH2913
        run: |
          set -e
          cd sdk
          
          echo ">>> 克隆 YYH2913/openwrt (分支 xr1710g-6.18-integration)..."
          git clone --depth=1 -b xr1710g-6.18-integration \
            https://github.com/YYH2913/openwrt.git /tmp/yyh
          
          echo ">>> 复制四个插件..."
          for pkg in \
            luci-app-airoha-flowsense \
            luci-app-airoha-npu \
            luci-app-mlo \
            luci-app-w1700k-fancontrol
          do
            if [ -d "/tmp/yyh/package/$pkg" ]; then
              echo "  ✓ $pkg"
              cp -a "/tmp/yyh/package/$pkg" package/
            else
              echo "  ✗ 错误：找不到 $pkg"
              echo "package 目录下现有的 luci-app："
              ls /tmp/yyh/package/ | grep luci-app || true
              exit 1
            fi
          done
          
          echo ""
          echo "=== 已添加的插件 ==="
          ls -d package/luci-app-*

      - name: Configure
        run: |
          set -e
          cd sdk
          
          echo "CONFIG_PACKAGE_luci-app-airoha-flowsense=m" >> .config
          echo "CONFIG_PACKAGE_luci-app-airoha-npu=m" >> .config
          echo "CONFIG_PACKAGE_luci-app-mlo=m" >> .config
          echo "CONFIG_PACKAGE_luci-app-w1700k-fancontrol=m" >> .config
          
          make defconfig
          echo "配置完成"

      - name: Compile all 4 packages
        run: |
          set -e
          cd sdk
          
          for pkg in \
            luci-app-airoha-flowsense \
            luci-app-airoha-npu \
            luci-app-mlo \
            luci-app-w1700k-fancontrol
          do
            echo ""
            echo "======== 开始编译 $pkg ========"
            make package/$pkg/compile V=s -j$(nproc) || make package/$pkg/compile V=s -j1
          done
          
          echo ""
          echo "======== 全部编译完成 ========"

      - name: Collect packages (.ipk / .apk)
        run: |
          mkdir -p output
          find sdk/bin \( -name "*.ipk" -o -name "*.apk" \) -exec cp -v {} output/ \;
          
          echo ""
          echo "=== 最终生成的文件 ==="
          ls -lh output/ || echo "未找到任何包文件"
          
          echo ""
          echo "ipk 数量: $(find output -name '*.ipk' | wc -l)"
          echo "apk 数量: $(find output -name '*.apk' | wc -l)"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-apps-${{ github.event.inputs.sdk_source }}-an7581
          path: |
            output/*.ipk
            output/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          # 生成日期 2026.08.09 格式
          DATE=$(date +%Y.%m.%d)

          if [ "${{ github.event.inputs.sdk_source }}" = "OpenWrt" ]; then
            TAG="OpenWrt-${DATE}"
            RELEASE_NAME="OpenWrt ${DATE}"
          else
            TAG="ImmortalWrt-${DATE}"
            RELEASE_NAME="ImmortalWrt ${DATE}"
          fi

          echo "Release 标签: $TAG"
          echo "Release 名称: $RELEASE_NAME"

          # 如果当天已存在同名 Release，先删除再重新创建（避免冲突）
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "已存在同名 Release，先删除..."
            gh release delete "$TAG" --yes
          fi

          # 创建 Release 并上传所有包
          gh release create "$TAG" \
            --title "$RELEASE_NAME" \
            --notes "自动编译自 YYH2913 四个插件

          - luci-app-airoha-flowsense
          - luci-app-airoha-npu
          - luci-app-mlo
          - luci-app-w1700k-fancontrol

          SDK: ${{ github.event.inputs.sdk_source }}
          Target: airoha/an7581
          编译时间: $(date '+%Y-%m-%d %H:%M:%S %Z')" \
            output/*
