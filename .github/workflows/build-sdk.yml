name: Build LuCI Airoha_an7581

on:
  workflow_dispatch:
    inputs:
      sdk_source:
        description: '选择 SDK 来源'
        required: true
        type: choice
        options:
          - ImmortalWrt
          - OpenWrt
        default: 'ImmortalWrt'
      clone_source:
        description: '选择克隆插件来源'
        required: true
        type: choice
        options:
          - YYH2913
          - naoki66
        default: 'YYH2913'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h

      - name: Download SDK
        run: |
          set -e
          
          if [ "${{ github.event.inputs.sdk_source }}" = "OpenWrt" ]; then
            SDK_URL="https://downloads.openwrt.org/snapshots/targets/airoha/an7581/openwrt-sdk-airoha-an7581_gcc-14.4.0_musl.Linux-x86_64.tar.zst"
            SDK_PREFIX="openwrt-sdk-*"
            echo ">>> 使用 OpenWrt SDK"
          else
            SDK_URL="https://downloads.immortalwrt.org/snapshots/targets/airoha/an7581/immortalwrt-sdk-airoha-an7581_gcc-14.4.0_musl.Linux-x86_64.tar.zst"
            SDK_PREFIX="immortalwrt-sdk-*"
            echo ">>> 使用 ImmortalWrt SDK"
          end
          
          echo "下载地址: $SDK_URL"
          wget -q --show-progress "$SDK_URL" -O sdk.tar.zst
          
          echo ">>> 解压 SDK..."
          tar --zstd -xf sdk.tar.zst
          
          SDK_DIR=$(find . -maxdepth 1 -type d -name "$SDK_PREFIX" | head -n1)
          if [ -z "$SDK_DIR" ]; then
            echo "错误：解压后未找到匹配的 SDK 目录 ($SDK_PREFIX)"
            ls -la
            exit 1
          fi
          
          echo "找到 SDK 目录: $SDK_DIR"
          mv "$SDK_DIR" sdk
          
          cd sdk
          echo ">>> 更新 feeds..."
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "SDK 准备完成"

      - name: Clone and copy plugins based on source
        run: |
          set -e
          cd sdk
          
          CLONE_SRC="${{ github.event.inputs.clone_source }}"
          echo ">>> 当前选择的克隆来源: $CLONE_Str"
          
          if [ "$CLONE_SRC" = "YYH2913" ]; then
            echo ">>> 克隆 YYH2913/openwrt (分支 xr1710g-6.18-integration)..."
            git clone --depth=1 -b xr1710g-6.18-integration \
              https://github.com/YYH2913/openwrt.git /tmp/yyh
            
            echo ">>> 复制全部 4 个插件..."
            for pkg in \
              luci-app-airoha-flowsense \
              luci-app-airoha-npu \
              luci-app-mlo \
              luci-app-w1700k-fancontrol
            do
              SRC_PATH=""
              if [ -d "/tmp/yyh/package/$pkg" ]; then
                SRC_PATH="/tmp/yyh/package/$pkg"
              elif [ -d "/tmp/yyh/$pkg" ]; then
                SRC_PATH="/tmp/yyh/$pkg"
              fi
              
              if [ -n "$SRC_PATH" ]; then
                echo "  ✓ 找到并复制 $pkg"
                cp -a "$SRC_PATH" package/
              else
                echo "  ✗ 错误：在 YYH2913 仓库中找不到 $pkg"
                exit 1
              fi
            done
            
          else
            echo ">>> 克隆 naoki66/ImmortalWrt-for-Gemtek-XR1710G (分支 master)..."
            git clone --depth=1 -b master \
              https://github.com/naoki66/ImmortalWrt-for-Gemtek-XR1710G.git /tmp/naoki
            
            echo ">>> 复制 naoki66 的 3 个插件..."
            for pkg in \
              luci-app-airoha-flowsense \
              luci-app-airoha-npu \
              luci-app-w1700k-fancontrol
            do
              SRC_PATH=""
              if [ -d "/tmp/naoki/package/$pkg" ]; then
                SRC_PATH="/tmp/naoki/package/$pkg"
              elif [ -d "/tmp/naoki/apps/$pkg" ]; then
                SRC_PATH="/tmp/naoki/apps/$pkg"
              elif [ -d "/tmp/naoki/$pkg" ]; then
                SRC_PATH="/tmp/naoki/$pkg"
              fi
              
              if [ -n "$SRC_PATH" ]; then
                echo "  ✓ 找到并复制 $pkg"
                cp -a "$SRC_PATH" package/
              else
                echo "  ✗ 错误：在 naoki66 仓库中找不到 $pkg"
                exit 1
              fi
            done
            
            echo ">>> 克隆 YYH2913/openwrt 获取 luci-app-mlo..."
            git clone --depth=1 -b xr1710g-6.18-integration \
              https://github.com/YYH2913/openwrt.git /tmp/yyh
            
            if [ -d "/tmp/yyh/package/luci-app-mlo" ]; then
              cp -a "/tmp/yyh/package/luci-app-mlo" package/
              echo "  ✓ 找到并复制 luci-app-mlo"
            elif [ -d "/tmp/yyh/luci-app-mlo" ]; then
              cp -a "/tmp/yyh/luci-app-mlo" package/
              echo "  ✓ 找到并复制 luci-app-mlo"
            else
              echo "  ✗ 错误：在 YYH2913 仓库中找不到 luci-app-mlo"
              exit 1
            fi
          fi
          
          echo ""
          echo "=== 已添加的插件 ==="
          ls -d package/luci-app-*

      - name: Configure
        run: |
          set -e
          cd sdk
          
          echo "CONFIG_PACKAGE_luci-app-airoha-flowsense=m" >> .config
          echo "CONFIG_PACKAGE_luci-app-airoha-npu=m" >> .config
          echo "CONFIG_PACKAGE_luci-app-mlo=m" >> .config
          echo "CONFIG_PACKAGE_luci-app-w1700k-fancontrol=m" >> .config
          
          make defconfig
          echo "配置完成"

      - name: Compile all 4 packages
        run: |
          set -e
          cd sdk
          
          for pkg in \
            luci-app-airoha-flowsense \
            luci-app-airoha-npu \
            luci-app-mlo \
            luci-app-w1700k-fancontrol
          do
            echo ""
            echo "======== 开始编译 $pkg ========"
            make package/$pkg/compile V=s -j$(nproc) || make package/$pkg/compile V=s -j1
          done
          
          echo ""
          echo "======== 全部编译完成 ========"

      - name: Collect packages (.apk)
        run: |
          mkdir -p output
          
          find sdk/bin -name "*.apk" | while read -r f; do
            case "$(basename "$f")" in
              *airoha*|*w1700k*|*mlo*)
                cp -v "$f" output/
                ;;
            esac
          done
          
          echo ""
          echo "=== 最终生成的文件 ==="
          ls -lh output/ || echo "未找到任何包文件"
          
          echo ""
          echo "apk 数量: $(find output -name '*.apk' | wc -l)"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-apps-${{ github.event.inputs.sdk_source }}-${{ github.event.inputs.clone_source }}-an7581
          path: |
            output/*airoha*.apk
            output/*w1700k*.apk
            output/*mlo*.apk
          if-no-files-found: error
            retention-days: 30

      - name: Create / Update Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          DATE=$(date +%Y.%m.%d)
          SDK_SRC="${{ github.event.inputs.sdk_source }}"
          CLONE_SRC="${{ github.event.inputs.clone_source }}"

          TAG="${SDK_SRC,,}_${CLONE_SRC,,}_${DATE}"
          RELEASE_NAME="${SDK_SRC} (${CLONE_SRC}) ${DATE}"

          echo "Release 标签: $TAG"
          echo "Release 名称: $RELEASE_NAME"

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "已存在同名 Release，直接上传文件（不删除）..."
            gh release upload "$TAG" output/* \
              --repo "${{ github.repository }}" \
              --clobber
          else
            echo "创建新 Release..."
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$RELEASE_NAME" \
              --notes "" \
              --output/*
          fi
